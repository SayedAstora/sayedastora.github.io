name: Build and deploy PS4 host
# A fresh push run avoids duplicate Pages artifacts left by a previous retry.
run-name: Fresh full deployment - single artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository assets
        uses: actions/checkout@v4
      - name: Download original GamerHack host
        run: |
          curl -L --fail https://github.com/GamerHack/GamerHack.github.io/archive/refs/heads/main.zip -o /tmp/host.zip
          mkdir /tmp/host
          unzip -q /tmp/host.zip -d /tmp/host
          cp -a /tmp/host/GamerHack.github.io-main/. "$GITHUB_WORKSPACE/"
      - name: Install store logo
        run: |
          printf '%s' '' | base64 -d > logo.jpg
      - name: Replace controller background and remove credits
        run: |
          cp logo.jpg img.jpg
          cat >> style.css <<'CSS'
          html {
              background-image: linear-gradient(rgba(0,0,0,.62), rgba(0,0,0,.78)), url('img.jpg');
              background-position: center;
              background-size: contain;
              background-attachment: fixed;
              background-repeat: no-repeat;
              background-color: #080a10;
          }
          h1 { text-shadow: 0 2px 8px #000, 0 0 14px #000; }
          CSS
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('g2all/index.html')
          s = p.read_text()
          s, n = re.subn(r'<h1\b[^>]*>[^<]*Special\s+Thanks\s+to:.*?</h1>', '', s, flags=re.I|re.S)
          print(f'Removed complete Special Thanks heading blocks: {n}')
          p.write_text(s)
          if 'ChendoChap' in s or 'Kameleonre_' in s or 'SiSTR0 Abc' in s:
              raise SystemExit('Credits text remains in generated HTML')

          PY
      - name: Apply Sayed Astora customization
        run: |
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#090b12">
            <title>متجر سيد أسطورة | PS4 Host</title>
            <link rel="stylesheet" href="store.css">
          </head>
          <body>
            <main class="page">
              <header class="brand">
                
                <div class="brand-copy">
                  <p class="eyebrow">PS4 EXPLOIT HOST</p>
                  <h1>متجر سيد أسطورة</h1>
                  <p>منصة تفعيل GoldHEN لأجهزة PlayStation 4</p>
                </div>
              </header>
              <section class="panel">
                <span class="status"><i></i> الكشف التلقائي عن إصدار النظام</span>
                <h2>التفعيل التلقائي</h2>
                <p>للإصدارات المدعومة من 9.00 إلى 14.02.</p>
                <a class="launch" href="g2all/index.html">بدء التفعيل التلقائي</a>
                <p class="note">افتح الموقع من متصفح PS4 واتركه يحدد المسار المناسب لإصدار جهازك.</p>
              </section>
              <footer>
                <p>صلاح الدين – بلد</p>
                <a href="tel:07824961985">07824961985</a>
                <p class="small">متجر سيد أسطورة</p>
              </footer>
            </main>
          </body>
          </html>
          HTML
          cat > store.css <<'CSS'
          *{box-sizing:border-box}html{min-height:100%;background:#080a10;color:#f6f6f8;font-family:Arial,Tahoma,sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#5a1018 0,#171018 38%,#080a10 76%);display:flex;align-items:center;justify-content:center;padding:28px 16px}.page{width:min(760px,100%);text-align:center}.brand{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:28px}.logo{display:block;width:100%;max-width:760px;height:auto;max-height:none;object-fit:contain;border-radius:18px;filter:drop-shadow(0 12px 35px #000)}.brand-copy h1{font-size:clamp(30px,7vw,48px);margin:8px 0;color:#fff}.brand-copy p{color:#c9c9ce;margin:8px 0}.eyebrow{letter-spacing:3px;color:#ff3939!important;font-weight:bold;font-size:13px}.panel{background:#141720eF;border:1px solid #ffffff20;border-radius:22px;padding:30px 22px;box-shadow:0 20px 70px #0008}.status{display:inline-flex;align-items:center;gap:9px;color:#a8f0bd;font-size:14px}.status i{width:9px;height:9px;border-radius:50%;background:#40d878;box-shadow:0 0 12px #40d878}.panel h2{font-size:26px;margin:20px 0 12px}.panel p{color:#c7c8ce;line-height:1.8}.launch{display:block;max-width:390px;margin:25px auto 15px;padding:17px 20px;border-radius:12px;background:linear-gradient(110deg,#b20f1e,#f02b32);color:white;text-decoration:none;font-size:21px;font-weight:bold;box-shadow:0 8px 28px #b20f1e55}.launch:active{transform:scale(.98)}.note{font-size:13px}footer{margin-top:26px;color:#c6c6cc;line-height:1.8}footer a{color:#ff6868;text-decoration:none;font-weight:bold}.small{font-size:12px;color:#858791}@media(min-width:700px){.brand{flex-direction:column;text-align:center;justify-content:center}.logo{width:100%;max-width:760px;height:auto}.brand-copy{max-width:100%}}
          CSS
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('g2all/index.html')
          s=p.read_text()
          s=s.replace('PS4 [5.05] 7.00 - 14.02 FW GoldHEN Host by GamerHack','متجر سيد أسطورة | GoldHEN 9.00 - 14.02')
          s=re.sub(r'(<h1\b[^>]*>)[^<]*GamerHack[^<]*(</h1>)', r'\1متجر سيد أسطورة | GoldHEN 9.00 - 14.02\2', s, flags=re.I)
          s=s.replace('Only for PS4 with Firmware 5.05 and 7.00 to 14.02','افتح هذا الموقع من جهاز PS4 بإصدار مدعوم من 9.00 إلى 14.02')
          s=s.replace("Only for PS4 with Firmware 5.05 and 7.00 to 14.02","افتح هذا الموقع من جهاز PS4 بإصدار مدعوم من 9.00 إلى 14.02")
          s=s.replace("Loading GoldHEN v2.4b18.14... Please Wait",'<span dir="rtl" style="unicode-bidi:plaintext">جاري تحديد إصدار النظام وتحميل مسار <bdi dir="ltr">GoldHEN</bdi> المناسب...</span>')
          p.write_text(s)
          # Customize only the PS4 host pages in g2all, including cache screens.
          old_heading = 'PS4 [5.05] 7.00 - 14.02 FW GoldHEN Host by GamerHack'
          new_heading = 'متجر سيد أسطورة | GoldHEN 9.00 - 14.02'
          for html in Path('g2all').rglob('*.html'):
              page = html.read_text(errors='ignore')
              page = page.replace(old_heading, new_heading)
              page = page.replace('GamerHack', 'متجر سيد أسطورة')
              page = re.sub(r'Installing\s+Offline\s+Cache\s*:?', 'تثبيت التخزين المؤقت للعمل بدون إنترنت', page, flags=re.I)
              page = page.replace('GoldHEN is already loaded', 'GoldHEN مُفعّل بالفعل')
              page = re.sub(r'cache\s+installed\s+successfully[.!]?', 'تم تثبيت التخزين المؤقت بنجاح', page, flags=re.I)
              page = re.sub(r'now\s+close\s+and\s+re-?open\s+your\s+browser', 'الآن أغلق المتصفح ثم أعد فتحه', page, flags=re.I)
              page = re.sub(r'close\s+and\s+re-?open\s+your\s+browser', 'أغلق المتصفح ثم أعد فتحه', page, flags=re.I)
              progress_js = """function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.style.cssText="width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;direction:rtl;margin:0 auto;font-size:30px";window.msgs.innerHTML='<span dir="rtl">تثبيت التخزين المؤقت للعمل بدون إنترنت</span> <bdi dir="ltr">' + Percent + '%</bdi>'; }"""
              if 'function DLProgress' in page:
                  page, progress_count = re.subn(r'function\s+DLProgress\(e\)\s*\{.*?\}', lambda _: progress_js, page, count=1, flags=re.S)
                  if progress_count != 1:
                      raise SystemExit(f'Could not patch cache progress function in {html}')

              page = re.sub(r'<h1\b[^>]*>[^<]*Special\s+Thanks\s+to:.*?</h1>', '', page, flags=re.I|re.S)
              # Show the full store image only on cache-installation screens and the final host page.
              if html.name in ('index.html', 'cache900.html', 'cachecss.html', 'cacheslopkit.html'):
                  image = '<style>html{background-color:#080a10!important;background-image:linear-gradient(rgba(0,0,0,.50),rgba(0,0,0,.50)),url("/sayed-astora-fullscreen.jpg")!important;background-position:center center!important;background-size:contain!important;background-repeat:no-repeat!important;background-attachment:fixed!important}body{background:transparent!important;position:relative}body:before{content:"";position:fixed;inset:-28px;background-image:linear-gradient(rgba(0,0,0,.48),rgba(0,0,0,.48)),url("/sayed-astora-fullscreen.jpg");background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(24px) brightness(.72) saturate(1.35);transform:scale(1.06);z-index:-1;pointer-events:none}</style>'
                  page = re.sub(r'(<body\b[^>]*>)', r'\1' + image, page, count=1, flags=re.I)
              html.write_text(page)
              if old_heading in page or 'Special Thanks to:' in page or 'GamerHack' in page:
                  raise SystemExit(f'Old branding or credits remain in {html}')
          # Add the Arabic Home-button instruction below the final GoldHEN status.
          for js_path in (Path('g2all/css/main.js'), Path('g2all/slopkit/jb.js')):
              if not js_path.exists():
                  continue
              js = js_path.read_text(errors='ignore')
              js = js.replace('"GoldHEN v2.4b18.14 Loaded ..."', '`GoldHEN v2.4b18.14 Loaded ...<div dir="rtl" style="margin-top:10px;line-height:1.8">تم تفعيل التعديل بنجاح<br>اخرج من زر الهوم<br>الذي يكون في منتصف اليد<br>متجر سيد أسطورة - قضاء بلد<br>واتس اب فقط - 07824961985</div>`')
              js = js.replace('"GoldHEN is Already Loaded ..."', '`GoldHEN is Already Loaded ...<div dir="rtl" style="margin-top:10px;line-height:1.8">تم تفعيل التعديل بنجاح<br>اخرج من زر الهوم<br>الذي يكون في منتصف اليد<br>متجر سيد أسطورة - قضاء بلد<br>واتس اب فقط - 07824961985</div>`')
              js_path.write_text(js)
              if 'اخرج من زر الهوم' not in js or 'الذي يكون في منتصف اليد' not in js:
                  raise SystemExit(f'Arabic Home instruction was not applied to {js_path}')
          # Change each AppCache manifest version to force PS4 to refresh cached pages.
          for manifest in Path('g2all').glob('*.manifest'):
              content = manifest.read_text(errors='ignore')
              content = re.sub(r'(?m)^# Sayed Astora cache revision .*$', '', content)
              manifest.write_text(content.rstrip() + '\n# Sayed Astora cache revision 8\n')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
